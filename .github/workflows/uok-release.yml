name: UOK Immutable Prerelease

on:
  push:
    tags:
      - "UOK-*"

concurrency:
  group: uok-prerelease-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UOK_RELEASE_RULESET_ID: "19715390"

jobs:
  validate:
    name: Validate exact release identity and repository controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      source_commit: ${{ steps.identity.outputs.source_commit }}
      image_repository: ${{ steps.identity.outputs.image_repository }}
      image_tag: ${{ steps.identity.outputs.image_tag }}
    steps:
      - name: Check out the exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Validate tag, source versions, commit, and main ancestry
        id: identity
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python scripts/validate_uok_release.py
          --tag "$RELEASE_TAG"
          --expected-commit "$EXPECTED_COMMIT"
          --require-ancestor-ref origin/main
          --github-repository "$GITHUB_REPOSITORY"
          --github-output "$GITHUB_OUTPUT"

      - name: Read back immutable release prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/rulesets/$UOK_RELEASE_RULESET_ID?includes_parents=true" \
            > "$RUNNER_TEMP/uok-release-tag-ruleset.json"
          python scripts/validate_uok_tag_ruleset.py \
            --input "$RUNNER_TEMP/uok-release-tag-ruleset.json"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/immutable-releases" \
            | jq -e '.enabled == true' >/dev/null

      - name: Validate immutable-release workflow policy
        run: python scripts/validate_release_workflow.py

  qualify:
    name: Build, scan, and package without publication credentials
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      LOCAL_IMAGE: uok-release:${{ needs.validate.outputs.source_commit }}
      SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
      VERSION: ${{ needs.validate.outputs.version }}
    outputs:
      image_id: ${{ steps.image-identity.outputs.image_id }}
      qualification_digest: ${{ steps.qualification.outputs.qualification_digest }}
    steps:
      - name: Check out validated source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.SOURCE_COMMIT }}

      - name: Prepare qualification directory
        run: mkdir -p qualification

      - name: Set up pinned Buildx and BuildKit
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          cache-binary: false
          driver-opts: |
            image=moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
          version: https://github.com/docker/buildx.git#a319e5b15052cf6557ceb666eb8ff6e32380b782

      - name: Build final OCI image once
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          build-args: |
            UOK_REVISION=${{ env.SOURCE_COMMIT }}
            UOK_SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            UOK_VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_COMMIT }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
          load: true
          platforms: linux/amd64
          provenance: false
          push: false
          sbom: false
          tags: ${{ env.LOCAL_IMAGE }}

      - name: Capture immutable local image identity
        id: image-identity
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' "$LOCAL_IMAGE")"
          if [[ ! "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Docker returned an invalid local image ID: $image_id"
            exit 1
          fi
          printf '%s\n' "$image_id" > qualification/UOK_IMAGE_ID
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"

      - name: Verify image identity labels by immutable ID
        env:
          QUALIFIED_IMAGE_ID: ${{ steps.image-identity.outputs.image_id }}
        run: |
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$QUALIFIED_IMAGE_ID")" = "$VERSION"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$QUALIFIED_IMAGE_ID")" = "$SOURCE_COMMIT"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$QUALIFIED_IMAGE_ID")" = "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"

      - name: Scan qualified image for release-blocking vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          exit-code: "1"
          format: json
          hide-progress: true
          ignore-unfixed: false
          image-ref: ${{ steps.image-identity.outputs.image_id }}
          output: qualification/uok-trivy.json
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          timeout: 15m
          version: v0.72.0

      - name: Preserve a failed vulnerability report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: uok-failed-scan-${{ env.VERSION }}
          path: qualification/uok-trivy.json
          retention-days: 14

      - name: Generate SPDX JSON SBOM from qualified image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          dependency-snapshot: false
          format: spdx-json
          image: ${{ steps.image-identity.outputs.image_id }}
          output-file: qualification/uok.spdx.json
          syft-version: v1.49.0
          upload-artifact: false
          upload-release-assets: false

      - name: Generate CycloneDX JSON SBOM from qualified image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          dependency-snapshot: false
          format: cyclonedx-json
          image: ${{ steps.image-identity.outputs.image_id }}
          output-file: qualification/uok.cyclonedx.json
          syft-version: v1.49.0
          upload-artifact: false
          upload-release-assets: false

      - name: Package exact committed source
        run: |
          temp_package="$(python scripts/package_uok_candidate.py --version "$VERSION" --source-ref "$SOURCE_COMMIT" --output-directory qualification)"
          mv "$temp_package" "qualification/UOK-${VERSION}-source.zip"

      - name: Export qualified image by immutable ID
        env:
          QUALIFIED_IMAGE_ID: ${{ steps.image-identity.outputs.image_id }}
        run: docker image save --output qualification/uok-image.tar "$QUALIFIED_IMAGE_ID"

      - name: Seal qualification evidence
        id: qualification
        run: |
          (
            cd qualification
            sha256sum \
              UOK_IMAGE_ID \
              "UOK-${VERSION}-source.zip" \
              uok-image.tar \
              uok.spdx.json \
              uok.cyclonedx.json \
              uok-trivy.json \
              > UOK_QUALIFICATION_SHA256SUMS
          )
          qualification_digest="$(sha256sum qualification/UOK_QUALIFICATION_SHA256SUMS | awk '{print $1}')"
          if [[ ! "$qualification_digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid qualification checksum-manifest digest"
            exit 1
          fi
          echo "qualification_digest=$qualification_digest" >> "$GITHUB_OUTPUT"

      - name: Upload sealed qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          compression-level: 0
          if-no-files-found: error
          name: uok-qualification-${{ env.VERSION }}
          path: qualification/*
          retention-days: 3

  publish-image:
    name: Publish only the qualified image
    needs:
      - validate
      - qualify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      IMAGE_REPOSITORY: ${{ needs.validate.outputs.image_repository }}
      IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
      QUALIFICATION_DIGEST: ${{ needs.qualify.outputs.qualification_digest }}
      QUALIFIED_IMAGE_ID: ${{ needs.qualify.outputs.image_id }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
      VERSION: ${{ needs.validate.outputs.version }}
    outputs:
      image_digest: ${{ steps.publish.outputs.image_digest }}
    steps:
      - name: Download sealed qualification evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uok-qualification-${{ env.VERSION }}
          path: qualification

      - name: Verify qualification evidence and load exact image
        run: |
          actual_manifest_digest="$(sha256sum qualification/UOK_QUALIFICATION_SHA256SUMS | awk '{print $1}')"
          test "$actual_manifest_digest" = "$QUALIFICATION_DIGEST"
          (cd qualification && sha256sum --check UOK_QUALIFICATION_SHA256SUMS)
          test "$(cat qualification/UOK_IMAGE_ID)" = "$QUALIFIED_IMAGE_ID"
          docker image load --input qualification/uok-image.tar
          test "$(docker image inspect --format '{{.Id}}' "$QUALIFIED_IMAGE_ID")" = "$QUALIFIED_IMAGE_ID"

      - name: Revalidate exact release-tag protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/rulesets/$UOK_RELEASE_RULESET_ID?includes_parents=true" \
            | jq -e --argjson expected_id "$UOK_RELEASE_RULESET_ID" '
                .id == $expected_id
                and .name == "UOK immutable release tags"
                and .target == "tag"
                and .enforcement == "active"
                and .conditions.ref_name.include == ["refs/tags/UOK-*"]
                and .conditions.ref_name.exclude == []
                and ([.rules[].type] | sort) == ["deletion", "update"]
                and has("bypass_actors")
                and .bypass_actors == []
                and .current_user_can_bypass == "never"
              ' >/dev/null

      - name: Authenticate to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Revalidate remote tag and publish qualified image
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_object="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          object_type="$(jq -er '.object.type' <<<"$tag_object")"
          object_sha="$(jq -er '.object.sha' <<<"$tag_object")"
          for _ in 1 2 3 4 5; do
            if [[ "$object_type" == "commit" ]]; then
              break
            fi
            if [[ "$object_type" != "tag" ]]; then
              echo "::error::Release tag resolves to unsupported object type: $object_type"
              exit 1
            fi
            tag_object="$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
            object_type="$(jq -er '.object.type' <<<"$tag_object")"
            object_sha="$(jq -er '.object.sha' <<<"$tag_object")"
          done
          test "$object_type" = "commit"
          test "$object_sha" = "$SOURCE_COMMIT"

          image_path="${IMAGE_REPOSITORY#ghcr.io/}"
          token_response="$(curl --fail-with-body --silent --show-error \
            --user "$GITHUB_ACTOR:$GH_TOKEN" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${image_path}:pull,push")"
          registry_token="$(jq -er '.token // .access_token' <<<"$token_response")"
          status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/uok-existing-manifest.json" \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer $registry_token" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${image_path}/manifests/${VERSION}")"
          case "$status" in
            200)
              echo "::error::Refusing to overwrite existing image tag $IMAGE_TAG"
              exit 1
              ;;
            404)
              ;;
            *)
              echo "::error::Cannot prove image tag absence; GHCR returned HTTP $status"
              exit 1
              ;;
          esac

          docker image tag "$QUALIFIED_IMAGE_ID" "$IMAGE_TAG"
          set +e
          push_output="$(docker image push "$IMAGE_TAG" 2>&1)"
          push_status=$?
          set -e
          printf '%s\n' "$push_output"
          test "$push_status" -eq 0
          image_digest="$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' <<<"$push_output" | tail -n 1)"
          if [[ ! "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Registry push did not return an immutable image digest"
            exit 1
          fi

          digest_status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/uok-published-manifest.json" \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer $registry_token" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${image_path}/manifests/${image_digest}")"
          test "$digest_status" = "200"
          remote_config="$(jq -er '.config.digest' "$RUNNER_TEMP/uok-published-manifest.json")"
          test "$remote_config" = "$QUALIFIED_IMAGE_ID"

          tag_headers="$RUNNER_TEMP/uok-published-tag.headers"
          tag_status="$(curl --silent --show-error \
            --dump-header "$tag_headers" \
            --output /dev/null \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer $registry_token" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${image_path}/manifests/${VERSION}")"
          test "$tag_status" = "200"
          current_tag_digest="$(awk 'tolower($1) == "docker-content-digest:" {gsub(/\r/, "", $2); print $2}' "$tag_headers" | tail -n 1)"
          test "$current_tag_digest" = "$image_digest"
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"

  prepare-release-bundle:
    name: Prepare checksummed release bundle without write credentials
    needs:
      - validate
      - qualify
      - publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      IMAGE_CONFIG_DIGEST: ${{ needs.qualify.outputs.image_id }}
      IMAGE_DIGEST: ${{ needs.publish-image.outputs.image_digest }}
      IMAGE_REPOSITORY: ${{ needs.validate.outputs.image_repository }}
      QUALIFICATION_DIGEST: ${{ needs.qualify.outputs.qualification_digest }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out validated source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.SOURCE_COMMIT }}

      - name: Download sealed qualification evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uok-qualification-${{ env.VERSION }}
          path: qualification

      - name: Verify qualification evidence
        run: |
          actual_manifest_digest="$(sha256sum qualification/UOK_QUALIFICATION_SHA256SUMS | awk '{print $1}')"
          test "$actual_manifest_digest" = "$QUALIFICATION_DIGEST"
          (cd qualification && sha256sum --check UOK_QUALIFICATION_SHA256SUMS)
          test "$(cat qualification/UOK_IMAGE_ID)" = "$IMAGE_CONFIG_DIGEST"

      - name: Create immutable release evidence
        run: |
          mkdir -p dist
          cp "qualification/UOK-${VERSION}-source.zip" dist/
          cp qualification/uok.spdx.json dist/
          cp qualification/uok.cyclonedx.json dist/
          cp qualification/uok-trivy.json dist/
          python scripts/uok_release_evidence_cli.py create \
            --output-directory dist \
            --tag "$RELEASE_TAG" \
            --version "$VERSION" \
            --source-commit "$SOURCE_COMMIT" \
            --github-repository "$GITHUB_REPOSITORY" \
            --image-repository "$IMAGE_REPOSITORY" \
            --image-digest "$IMAGE_DIGEST" \
            --image-config-digest "$IMAGE_CONFIG_DIGEST" \
            --source-package "dist/UOK-${VERSION}-source.zip" \
            --spdx-sbom dist/uok.spdx.json \
            --cyclonedx-sbom dist/uok.cyclonedx.json \
            --vulnerability-report dist/uok-trivy.json
          python scripts/uok_release_evidence_cli.py verify --directory dist
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload qualified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: uok-release-${{ env.VERSION }}
          path: dist/*
          retention-days: 30

  attest:
    name: Attest only the checksummed qualified artifacts
    needs:
      - validate
      - publish-image
      - prepare-release-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE_DIGEST: ${{ needs.publish-image.outputs.image_digest }}
      IMAGE_REPOSITORY: ${{ needs.validate.outputs.image_repository }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Download qualified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uok-release-${{ env.VERSION }}
          path: dist

      - name: Verify release checksums without executing repository code
        run: |
          unexpected="$(find dist -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          test -z "$unexpected"
          awk '
            NF != 2 ||
            length($1) != 64 || $1 !~ /^[0-9a-f]+$/ ||
            $2 !~ /^[A-Za-z0-9][A-Za-z0-9._+-]*$/ { exit 1 }
            { print $2 }
          ' dist/SHA256SUMS | sort > "$RUNNER_TEMP/expected-release-files"
          find dist -mindepth 1 -maxdepth 1 -type f \
            ! -name SHA256SUMS -printf '%f\n' \
            | sort > "$RUNNER_TEMP/actual-release-files"
          cmp "$RUNNER_TEMP/expected-release-files" \
            "$RUNNER_TEMP/actual-release-files"
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Authenticate to GHCR for registry attestations
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Attest immutable image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          create-storage-record: false
          push-to-registry: true
          subject-digest: ${{ env.IMAGE_DIGEST }}
          subject-name: ${{ env.IMAGE_REPOSITORY }}

      - name: Attest SPDX SBOM to the immutable image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          create-storage-record: false
          push-to-registry: true
          sbom-path: dist/uok.spdx.json
          subject-digest: ${{ env.IMAGE_DIGEST }}
          subject-name: ${{ env.IMAGE_REPOSITORY }}

      - name: Attest CycloneDX SBOM to the immutable image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          create-storage-record: false
          push-to-registry: true
          sbom-path: dist/uok.cyclonedx.json
          subject-digest: ${{ env.IMAGE_DIGEST }}
          subject-name: ${{ env.IMAGE_REPOSITORY }}

      - name: Attest release files from checksums
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: dist/SHA256SUMS

  release:
    name: Publish immutable GitHub prerelease
    needs:
      - validate
      - qualify
      - publish-image
      - prepare-release-bundle
      - attest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      IMAGE_CONFIG_DIGEST: ${{ needs.qualify.outputs.image_id }}
      IMAGE_DIGEST: ${{ needs.publish-image.outputs.image_digest }}
      IMAGE_REPOSITORY: ${{ needs.validate.outputs.image_repository }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Download qualified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uok-release-${{ env.VERSION }}
          path: dist

      - name: Verify exact release identity and checksums
        run: |
          unexpected="$(find dist -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          test -z "$unexpected"
          awk '
            NF != 2 ||
            length($1) != 64 || $1 !~ /^[0-9a-f]+$/ ||
            $2 !~ /^[A-Za-z0-9][A-Za-z0-9._+-]*$/ { exit 1 }
            { print $2 }
          ' dist/SHA256SUMS | sort > "$RUNNER_TEMP/expected-release-files"
          find dist -mindepth 1 -maxdepth 1 -type f \
            ! -name SHA256SUMS -printf '%f\n' \
            | sort > "$RUNNER_TEMP/actual-release-files"
          cmp "$RUNNER_TEMP/expected-release-files" \
            "$RUNNER_TEMP/actual-release-files"
          (cd dist && sha256sum --check SHA256SUMS)
          jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg image_repository "$IMAGE_REPOSITORY" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg image_config_digest "$IMAGE_CONFIG_DIGEST" \
            '
              .tag == $tag
              and .source_commit == $source_commit
              and .image.repository == $image_repository
              and .image.digest == $image_digest
              and .image.config_digest == $image_config_digest
              and .image.reference == ($image_repository + "@" + $image_digest)
              and .release_controls.git_tag_ruleset.id == 19715390
              and .release_controls.git_tag_ruleset.protected == true
              and .release_controls.ghcr.version_tag_is_authority == false
              and .release_controls.ghcr.digest_is_authority == true
            ' dist/UOK_RELEASE_MANIFEST.json >/dev/null

      - name: Revalidate exact release-tag protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/rulesets/$UOK_RELEASE_RULESET_ID?includes_parents=true" \
            | jq -e --argjson expected_id "$UOK_RELEASE_RULESET_ID" '
                .id == $expected_id
                and .name == "UOK immutable release tags"
                and .target == "tag"
                and .enforcement == "active"
                and .conditions.ref_name.include == ["refs/tags/UOK-*"]
                and .conditions.ref_name.exclude == []
                and ([.rules[].type] | sort) == ["deletion", "update"]
                and has("bypass_actors")
                and .bypass_actors == []
                and .current_user_can_bypass == "never"
              ' >/dev/null

      - name: Refuse an existing GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Refusing to replace existing GitHub release $RELEASE_TAG"
            exit 1
          fi

      - name: Revalidate protected tag and create immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_object="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          object_type="$(jq -er '.object.type' <<<"$tag_object")"
          object_sha="$(jq -er '.object.sha' <<<"$tag_object")"
          for _ in 1 2 3 4 5; do
            if [[ "$object_type" == "commit" ]]; then
              break
            fi
            if [[ "$object_type" != "tag" ]]; then
              echo "::error::Release tag resolves to unsupported object type: $object_type"
              exit 1
            fi
            tag_object="$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
            object_type="$(jq -er '.object.type' <<<"$tag_object")"
            object_sha="$(jq -er '.object.sha' <<<"$tag_object")"
          done
          test "$object_type" = "commit"
          test "$object_sha" = "$SOURCE_COMMIT"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/immutable-releases" \
            | jq -e '.enabled == true' >/dev/null
          find dist -mindepth 1 -maxdepth 1 -type f -printf '%f\n' \
            | sort | jq -R -s 'split("\n")[:-1]' \
            > "$RUNNER_TEMP/expected-release-assets.json"
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "UOK $VERSION prerelease" \
            --notes-file dist/RELEASE_NOTES.md \
            --prerelease \
            --verify-tag \
            --latest=false
          for _ in 1 2 3 4 5; do
            release="$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
            if jq -e \
              --arg tag "$RELEASE_TAG" \
              --slurpfile expected "$RUNNER_TEMP/expected-release-assets.json" \
              '
                .tag_name == $tag
                and .draft == false
                and .prerelease == true
                and .immutable == true
                and ([.assets[].name] | sort) == $expected[0]
              ' <<<"$release" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Published release is not immutable or exact"
          exit 1
