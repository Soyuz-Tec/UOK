name: Debug Reports Python Tests

on:
  push:
    branches:
      - feature/reports-core-global-artifacts

jobs:
  debug-python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run Python tests with visible filenames
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          for test_file in sorted(Path("tests").glob("test_*.py")):
              print(f"RUNNING {test_file.as_posix()}", flush=True)
              subprocess.run([sys.executable, "-m", "pytest", "-q", str(test_file)], check=True)
          PY
