[project]
name = "uok"
version = "3.1.0a3"
description = "UOK baseline for real development."
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.139.0",
  "uvicorn[standard]==0.50.0",
  "sqlalchemy==2.0.51",
  "pydantic==2.13.4",
  "psycopg[binary]==3.3.4",
  "argon2-cffi==25.1.0",
  "python-multipart==0.0.32",
  "python-dateutil==2.9.0.post0",
  "icalendar==7.2.0",
  "phonenumbers==9.0.35",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "httpx2==2.5.0",
  "pip-audit==2.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "modules"]
addopts = "-q"
