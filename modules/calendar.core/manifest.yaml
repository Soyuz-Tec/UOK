manifest_schema: uok.module.v1
name: calendar.core
kind: capability_module
version: APP_VERSION
description: "Global calendars, events, recurrence, persisted reminder rules, free-busy context, and iCalendar export for UOK apps."
maturity: runtime_proven
installable: true
uninstallable: true
updatable: true
maintainable: true
required: false
lifecycle:
  - available
  - installed
  - disabled
  - upgraded
  - uninstalled
commands:
  - CreateCalendar
  - UpdateCalendar
  - DeleteCalendar
  - RestoreCalendar
  - CreateCalendarEvent
  - UpdateCalendarEvent
  - CancelCalendarEvent
  - RestoreCalendarEvent
  - CreateCalendarReminder
  - DeleteCalendarReminder
events:
  - CalendarCreated
  - CalendarUpdated
  - CalendarDeleted
  - CalendarRestored
  - CalendarEventCreated
  - CalendarEventUpdated
  - CalendarEventCanceled
  - CalendarEventRestored
  - CalendarReminderCreated
  - CalendarReminderDeleted
dependencies: []
backend_path: modules/calendar.core/backend
web_path: modules/calendar.core/web
web_entry: modules/calendar.core/web/src/moduleSurface.tsx
web_section: calendar
migrations_path: modules/calendar.core/migrations
tests_path: modules/calendar.core/tests
api_prefixes:
  - /api/calendar
api_router: uok_calendar_core.api:router
command_handlers: uok_calendar_core.commands:command_handlers
command_permissions: uok_calendar_core.commands:command_permissions
role_grants: uok_calendar_core.policy:role_grants
model_exports: uok_calendar_core.models:owned_models
candidate_verifier_script: modules/calendar.core/verify/UokCandidateCalendar.ps1
candidate_verifier_function: Invoke-UokCalendarCandidateScenario
permissions:
  - calendar.read
  - calendar.manage
  - calendar.event.create
  - calendar.event.update
  - calendar.event.cancel
  - calendar.event.restore
  - calendar.freebusy.read
  - calendar.reminder.manage
  - calendar.ics.export
owned_tables:
  - Calendar
  - CalendarEvent
  - CalendarEventParticipant
  - CalendarReminder
  - CommandLog:calendar.core
  - EventRecord:Calendar
extension_points:
  - api_router
  - command_handlers
  - command_permissions
  - role_grants
  - model_exports
  - web_surface
  - candidate_verifier
data_retention_policy: "Calendar records are organization-scoped. Governed Calendar deletion soft-deletes a user-managed parent and hides retained event, participant, and reminder history from active reads until an authorized restore; event cancellation also retains history for audit. Generated and system-owned Calendars are not user-deletable. Purge is intentionally deferred to a future governance workflow."
