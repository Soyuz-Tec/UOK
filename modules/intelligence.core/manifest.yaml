manifest_schema: uok.module.v1
name: intelligence.core
kind: capability_module
version: APP_VERSION
description: "Read-only tenant-scoped Shipment readiness signals derived from immutable Shipment owner facts."
maturity: runtime_proven
installable: true
uninstallable: true
updatable: true
maintainable: true
required: false
lifecycle:
  - available
  - installed
  - disabled
  - upgraded
  - uninstalled
commands: []
events: []
dependencies:
  - shipments.core
backend_path: modules/intelligence.core/backend
web_path: modules/intelligence.core/web
web_entry: modules/intelligence.core/web/src/moduleSurface.tsx
web_section: intelligence
migrations_path: modules/intelligence.core/migrations
tests_path: modules/intelligence.core/tests
api_prefixes:
  - /api/intelligence
api_router: uok_intelligence_core.public_api:api_router
role_grants: uok_intelligence_core.public_api:role_grants
candidate_verifier_script: modules/intelligence.core/verify/UokCandidateShipmentReadiness.ps1
candidate_verifier_function: Invoke-UokShipmentReadinessCandidateScenario
permissions:
  - intelligence.read
owned_tables: []
extension_points:
  - api_router
  - role_grants
  - web_surface
  - candidate_verifier
data_retention_policy: "Stateless advisory capability: no signal rows, snapshots, commands, events, caches, or other tenant data are persisted."
