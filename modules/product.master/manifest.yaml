manifest_schema: uok.module.v1
name: product.master
kind: capability_module
version: APP_VERSION
description: "Tenant-scoped Product Master registry for canonical product and material definitions."
maturity: runtime_proven
installable: true
uninstallable: true
updatable: true
maintainable: true
required: false
lifecycle:
  - available
  - installed
  - disabled
  - upgraded
  - uninstalled
commands:
  - CreateProductDefinition
  - UpdateProductDefinition
  - ArchiveProductDefinition
  - RestoreProductDefinition
events:
  - ProductDefinitionCreated
  - ProductDefinitionUpdated
  - ProductDefinitionArchived
  - ProductDefinitionRestored
dependencies: []
backend_path: modules/product.master/backend
web_path: modules/product.master/web
web_entry: modules/product.master/web/src/moduleSurface.tsx
web_section: products
migrations_path: modules/product.master/migrations
tests_path: modules/product.master/tests
api_prefixes:
  - /api/products
api_router: uok_product_master.public_api:api_router
command_handlers: uok_product_master.public_api:command_handlers
command_permissions: uok_product_master.public_api:command_permissions
role_grants: uok_product_master.public_api:role_grants
model_exports: uok_product_master._internal.persistence.models:owned_models
candidate_verifier_script: modules/product.master/verify/UokCandidateProductMaster.ps1
candidate_verifier_function: Invoke-UokProductMasterCandidateScenario
permissions:
  - products.read
  - products.manage
owned_tables:
  - ProductDefinition
  - ProductNameHistory
  - CommandLog:product.master
  - EventRecord:ProductDefinition
extension_points:
  - api_router
  - command_handlers
  - command_permissions
  - role_grants
  - model_exports
  - web_surface
  - candidate_verifier
data_retention_policy: "Archive preserves Product Definitions and immutable name history. Module uninstall disables access while retaining tenant-owned records for authorized recovery."
