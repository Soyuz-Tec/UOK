manifest_schema: uok.module.v1
name: reports.core
kind: capability_module
version: APP_VERSION
description: "Global secure report and artifact generation capability shared by UOK modules."
maturity: runtime_proven
installable: true
uninstallable: true
updatable: true
maintainable: true
required: false
lifecycle:
  - available
  - installed
  - disabled
  - upgraded
  - uninstalled
commands:
  - GenerateReport
  - DeleteReportArtifact
  - VerifyReportArtifact
events:
  - ReportGenerated
  - ReportGenerationFailed
  - ReportArtifactDeleted
  - ReportArtifactVerified
dependencies: []
backend_path: modules/reports.core/backend
web_path: modules/reports.core/web
migrations_path: modules/reports.core/migrations
tests_path: modules/reports.core/tests
api_prefixes:
  - /api/reports
api_router: uok_reports_core.api:router
command_handlers: uok_reports_core.commands:command_handlers
command_permissions: uok_reports_core.commands:command_permissions
role_grants: uok_reports_core.policy:role_grants
model_exports: uok_reports_core.models:owned_models
candidate_verifier_script: modules/reports.core/verify/UokCandidateReports.ps1
candidate_verifier_function: Invoke-UokReportsCandidateScenario
permissions:
  - reports.render
  - reports.read
  - reports.manage
  - reports.delete
owned_tables:
  - ReportArtifact
  - CommandLog:reports.core
  - EventRecord:Report
extension_points:
  - api_router
  - command_handlers
  - command_permissions
  - role_grants
  - model_exports
  - candidate_verifier
data_retention_policy: "Generated artifacts are organization-scoped, stored outside the public webroot under DATA_DIR, content-hashed, audited, and deletable only by authorized users."
