manifest_schema: uok.module.v1
name: contacts.core
kind: capability_module
version: APP_VERSION
description: "Governed optional Party and Contacts system of record with first-class facts, consent, teams, groups, quality, import/export evidence, saved views, external identities, and custom fields."
maturity: runtime_proven
installable: true
uninstallable: true
updatable: true
maintainable: true
required: false
lifecycle:
  - available
  - installed
  - disabled
  - upgraded
  - uninstalled
commands:
  - CreateContact
  - CreateContactGroup
  - UpdateContact
  - UpdateContactGroup
  - ArchiveContact
  - ArchiveContactGroup
  - RestoreContactGroup
  - RestoreContact
  - PurgeContact
  - AddContactNote
  - AddContactsToGroup
  - RemoveContactFromGroup
  - GroupContactsByBusinessEmailDomain
  - GroupContactsBySmartRule
  - LinkContactRelationship
  - MergeDuplicateContact
  - RollbackDuplicateMerge
  - UpdateContactRelationship
  - RemoveContactRelationship
  - ImportContactsCsv
  - ImportContactsVCard
  - RollbackContactImport
  - UpsertContactFact
  - RemoveContactFact
  - RecordContactConsent
  - CreateContactTeam
  - UpdateContactTeam
  - AddContactTeamMember
  - RemoveContactTeamMember
  - SaveContactView
  - DeleteContactView
  - RefreshContactDuplicateCandidates
  - ResolveContactDuplicateCandidate
  - BulkUpdateContacts
  - LinkContactExternalIdentity
  - DefineContactCustomField
  - SetContactCustomFieldValue
events:
  - ContactCreated
  - ContactGroupCreated
  - ContactGroupUpdated
  - ContactGroupArchived
  - ContactGroupRestored
  - ContactAddedToGroup
  - ContactRemovedFromGroup
  - ContactsGroupedByBusinessEmailDomain
  - ContactsGroupedBySmartRule
  - ContactUpdated
  - ContactArchived
  - ContactRestored
  - ContactPurged
  - ContactNoteAdded
  - ContactRelationshipLinked
  - ContactDuplicateMerged
  - ContactDuplicateMergeRolledBack
  - ContactRelationshipUpdated
  - ContactRelationshipRemoved
