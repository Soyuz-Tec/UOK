name: contacts.core
kind: capability_module
version: APP_VERSION
description: "Optional reusable party, person, organization, profile, note, relationship, review, and CSV import capability."
installable: true
uninstallable: true
updatable: true
maintainable: true
required: false
lifecycle:
  - available
  - installed
  - disabled
  - upgraded
  - uninstalled
commands:
  - CreateContact
  - UpdateContact
  - ArchiveContact
  - RestoreContact
  - PurgeContact
  - AddContactNote
  - LinkContactRelationship
  - ImportContactsCsv
  - UpdateContactProfile
  - RecordContactProfileEvidence
  - RebuildContactProfile
events:
  - ContactCreated
  - ContactUpdated
  - ContactArchived
  - ContactRestored
  - ContactPurged
  - ContactNoteAdded
  - ContactRelationshipLinked
  - ContactLinkedToOrganization
  - ContactsImported
  - ContactProfileUpdated
  - ContactProfileEvidenceRecorded
  - ContactProfileRebuilt
dependencies: []
backend_path: modules/contacts.core/backend
web_path: modules/contacts.core/web
migrations_path: modules/contacts.core/migrations
tests_path: modules/contacts.core/tests
api_prefixes:
  - /api/contacts
api_router: uok_contacts_core.api:router
command_handlers: uok_contacts_core.commands:command_handlers
command_permissions: uok_contacts_core.commands:command_permissions
role_grants: uok_contacts_core.policy:role_grants
dashboard_provider: uok_contacts_core.reports:dashboard_counts
evidence_provider: uok_contacts_core.reports:evidence
model_exports: uok_contacts_core.models:owned_models
candidate_verifier_script: modules/contacts.core/tests/verify/UokCandidateContacts.ps1
candidate_verifier_function: Invoke-UokContactsCandidateScenario
candidate_evidence_function: Assert-UokCandidateEvidence
permissions:
  - contacts.read
  - contacts.manage
  - contacts.restore
  - contacts.purge
  - contacts.import
owned_tables:
  - Party
  - PartyNote
  - PartyRelationship
  - ContactImportBatch
  - CommandLog:contacts.core
  - EventRecord:Contact
  - Party.attrs_json:business_profile
  - Party.attrs_json:business_profile_evidence
extension_points:
  - manifest
  - backend_package
  - command_handlers
  - api_router
  - dashboard_provider
  - evidence_provider
  - model_exports
  - permissions
  - events
  - migrations
  - web_surface
  - tests
  - candidate_verifier
data_retention_policy: "User delete archives contacts and their business profile data; admin can restore or purge. Module uninstall disables access while retaining records and profile evidence for admin-controlled recovery unless a future purge workflow is explicitly executed. Profile enrichment stores normalized facts with source metadata, confidence, allowed-use, and retention hints rather than unbounded raw provider payloads."
