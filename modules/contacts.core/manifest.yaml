name: contacts.core
kind: capability_module
version: APP_VERSION
description: "Optional reusable party, person, organization, note, relationship, review, and CSV import capability."
installable: true
uninstallable: true
updatable: true
maintainable: true
required: false
lifecycle:
  - available
  - installed
  - disabled
  - upgraded
  - uninstalled
commands:
  - CreateContact
  - CreateContactGroup
  - UpdateContact
  - UpdateContactGroup
  - ArchiveContact
  - ArchiveContactGroup
  - RestoreContact
  - PurgeContact
  - AddContactNote
  - AddContactsToGroup
  - RemoveContactFromGroup
  - GroupContactsByBusinessEmailDomain
  - GroupContactsBySmartRule
  - LinkContactRelationship
  - MergeDuplicateContact
  - RollbackDuplicateMerge
  - UpdateContactRelationship
  - RemoveContactRelationship
  - ImportContactsCsv
events:
  - ContactCreated
  - ContactGroupCreated
  - ContactGroupUpdated
  - ContactGroupArchived
  - ContactAddedToGroup
  - ContactRemovedFromGroup
  - ContactsGroupedByBusinessEmailDomain
  - ContactsGroupedBySmartRule
  - ContactUpdated
  - ContactArchived
  - ContactRestored
  - ContactPurged
  - ContactNoteAdded
  - ContactRelationshipLinked
  - ContactDuplicateMerged
  - ContactDuplicateMergeRolledBack
  - ContactRelationshipUpdated
  - ContactRelationshipRemoved
  - ContactLinkedToOrganization
  - ContactsImported
dependencies: []
backend_path: modules/contacts.core/backend
web_path: modules/contacts.core/web
migrations_path: modules/contacts.core/migrations
tests_path: modules/contacts.core/tests
api_prefixes:
  - /api/contacts
api_router: uok_contacts_core.api:router
command_handlers: uok_contacts_core.commands:command_handlers
command_permissions: uok_contacts_core.commands:command_permissions
role_grants: uok_contacts_core.policy:role_grants
dashboard_provider: uok_contacts_core.reports:dashboard_counts
evidence_provider: uok_contacts_core.reports:evidence
model_exports: uok_contacts_core.models:owned_models
candidate_verifier_script: modules/contacts.core/tests/verify/UokCandidateContacts.ps1
candidate_verifier_function: Invoke-UokContactsCandidateScenario
candidate_evidence_function: Assert-UokCandidateEvidence
permissions:
  - contacts.read
  - contacts.manage
  - contacts.restore
  - contacts.purge
  - contacts.import
owned_tables:
  - ContactGroup
  - ContactGroupMember
  - Party
  - PartyNote
  - PartyRelationship
  - ContactImportBatch
  - CommandLog:contacts.core
  - EventRecord:Contact
extension_points:
  - manifest
  - backend_package
  - command_handlers
  - api_router
  - dashboard_provider
  - evidence_provider
  - model_exports
  - permissions
  - events
  - migrations
  - web_surface
  - tests
  - candidate_verifier
data_retention_policy: "User delete archives contacts; admin can restore or purge. Module uninstall disables access while retaining records for admin-controlled recovery unless a future purge workflow is explicitly executed."
