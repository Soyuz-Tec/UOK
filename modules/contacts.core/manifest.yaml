  - ContactsImported
  - ContactsImportPreviewed
  - ContactsVCardPreviewed
  - ContactsVCardImported
  - ContactsImportRolledBack
  - ContactFactSaved
  - ContactFactRemoved
  - ContactConsentRecorded
  - ContactTeamCreated
  - ContactTeamUpdated
  - ContactTeamMemberAdded
  - ContactTeamMemberRemoved
  - ContactSavedViewSaved
  - ContactSavedViewDeleted
  - ContactDuplicateCandidatesRefreshed
  - ContactDuplicateCandidateResolved
  - ContactsBulkUpdated
  - ContactExternalIdentityLinked
  - ContactCustomFieldDefined
  - ContactCustomFieldValueSet
dependencies: []
backend_path: modules/contacts.core/backend
web_path: modules/contacts.core/web
web_entry: modules/contacts.core/web/src/moduleSurface.tsx
web_section: contacts
migrations_path: modules/contacts.core/migrations
tests_path: modules/contacts.core/tests
api_prefixes:
  - /api/contacts
api_router: uok_contacts_core.api:router
command_handlers: uok_contacts_core.commands:command_handlers
command_permissions: uok_contacts_core.commands:command_permissions
role_grants: uok_contacts_core.policy:role_grants
dashboard_provider: uok_contacts_core.reports:dashboard_counts
evidence_provider: uok_contacts_core.reports:evidence
model_exports: uok_contacts_core.models:owned_models
candidate_verifier_script: modules/contacts.core/verify/UokCandidateContacts.ps1
candidate_verifier_function: Invoke-UokContactsCandidateScenario
permissions:
  - contacts.read
  - contacts.manage
  - contacts.restore
  - contacts.purge
  - contacts.import
  - contacts.bulk
  - contacts.consent
  - contacts.customize
  - contacts.dedupe
  - contacts.export
  - contacts.sync
  - contacts.team.manage
owned_tables:
  - ContactGroup
  - ContactGroupMember
  - Party
  - PartyNote
  - PartyRelationship
  - ContactImportBatch
  - ContactActivity
  - ContactConsentRecord
  - ContactCustomFieldDefinition
  - ContactDuplicateCandidate
  - ContactExternalIdentity
  - ContactImportRow
  - ContactSavedView
  - ContactTeam
  - ContactTeamMember
  - PartyCustomFieldValue
  - PartyFact
  - CommandLog:contacts.core
  - EventRecord:Contact
extension_points:
  - api_router
  - command_handlers
  - command_permissions
  - role_grants
  - dashboard_provider
  - evidence_provider
  - model_exports
  - web_surface
  - candidate_verifier
data_retention_policy: "User delete archives contacts; authorized purge irreversibly anonymizes contact-owned PII while retaining a non-PII tombstone and platform audit evidence. Consent and import evidence follow explicit organization retention policy. Module uninstall disables access while retaining records for admin-controlled recovery."
