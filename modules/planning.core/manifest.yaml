manifest_schema: uok.module.v1
name: planning.core
kind: capability_module
version: APP_VERSION
description: "Optional project planning, task participant, scheduling, execution-date, dependency, baseline, typed operation-link, calendar, and Gantt capability."
maturity: runtime_proven
installable: true
uninstallable: true
updatable: true
maintainable: true
required: false
lifecycle:
  - available
  - installed
  - disabled
  - upgraded
  - uninstalled
commands:
  - CreatePlanningProject
  - TransitionPlanningProject
  - CreatePlanningTask
  - UpdatePlanningTask
  - UpdatePlanningTaskDates
  - DeletePlanningTask
  - LinkPlanningTasks
  - UpdatePlanningDependency
  - RemovePlanningDependency
  - SetPlanningCalendar
  - CreatePlanningBaseline
  - CreatePlanningResource
  - SetPlanningResourceCalendar
  - AssignPlanningResource
  - LevelPlanningResources
  - BatchPlanningOperations
  - CreatePlanningLink
  - RemovePlanningLink
  - AddPlanningTaskParticipant
  - RemovePlanningTaskParticipant
  - CreatePlanningTaskRequirement
  - AdvancePlanningTaskRequirement
  - SetPlanningTaskRequirementLink
  - DecidePlanningTaskRequirement
  - CreatePlanningWhatIfSnapshot
  - RunPlanningRiskAnalysis
  - RunPlanningOptimization
  - DecidePlanningRecommendation
  - ApplyPlanningRecommendation
  - RollbackPlanningRecommendation
events:
  - PlanningProjectCreated
  - PlanningProjectTransitioned
  - PlanningTaskCreated
  - PlanningTaskUpdated
  - PlanningTaskDatesUpdated
  - PlanningTaskDeleted
  - PlanningTaskLinked
  - PlanningDependencyUpdated
  - PlanningDependencyRemoved
  - PlanningCalendarUpdated
  - PlanningBaselineCreated
  - PlanningResourceCreated
  - PlanningResourceCalendarUpdated
  - PlanningResourceAssigned
  - PlanningResourcesLeveled
  - PlanningBatchApplied
  - PlanningLinkCreated
  - PlanningLinkRemoved
  - PlanningTaskParticipantAdded
  - PlanningTaskParticipantRemoved
  - PlanningTaskRequirementCreated
  - PlanningTaskRequirementAdvanced
  - PlanningTaskRequirementLinkSet
  - PlanningTaskRequirementDecided
  - PlanningWhatIfSnapshotCreated
  - PlanningRiskAnalysisCompleted
  - PlanningOptimizationCompleted
  - PlanningRecommendationDecided
  - PlanningRecommendationApplied
  - PlanningRecommendationRolledBack
dependencies:
  - calendar.core
backend_path: modules/planning.core/backend
web_path: modules/planning.core/web
web_entry: modules/planning.core/web/src/moduleSurface.tsx
web_section: planning
migrations_path: modules/planning.core/migrations
tests_path: modules/planning.core/tests
api_prefixes:
  - /api/planning
api_router: uok_planning_core.api:router
command_handlers: uok_planning_core.commands:command_handlers
command_permissions: uok_planning_core.commands:command_permissions
command_replay_guard: uok_planning_core.replay_visibility:assert_planning_replay_visible
role_grants: uok_planning_core.policy:role_grants
dashboard_provider: uok_planning_core.reports:dashboard_counts
evidence_provider: uok_planning_core.reports:evidence
model_exports: uok_planning_core.models:owned_models
candidate_verifier_script: modules/planning.core/verify/UokCandidatePlanning.ps1
candidate_verifier_function: Invoke-UokPlanningCandidateScenario
permissions:
  - planning.read
  - planning.edit
  - planning.baseline.create
  - planning.level
  - planning.link
  - planning.gate.approve
  - planning.admin
  - planning.analyze
  - planning.analysis.approve
owned_tables:
  - PlanningProject
  - PlanningTask
  - PlanningTaskParticipant
  - PlanningTaskRequirement
  - PlanningTaskDependency
  - PlanningCalendar
  - PlanningLink
  - PlanningResource
  - PlanningResourceCalendar
  - PlanningAssignment
  - PlanningBaseline
  - PlanningScheduleEvent
  - PlanningScheduleRevision
  - PlanningOutboxEvent
  - PlanningWhatIfSnapshot
  - PlanningAnalysisRun
  - PlanningAnalysisRecommendation
  - CommandLog:planning.core
  - EventRecord:Planning
extension_points:
  - api_router
  - command_handlers
  - command_permissions
  - command_replay_guard
  - role_grants
  - dashboard_provider
  - evidence_provider
  - model_exports
  - web_surface
  - candidate_verifier
data_retention_policy: "User delete archives or disables planning access; schedule records, baselines, and audit events are retained for admin-controlled recovery unless a future purge workflow is explicitly executed."
