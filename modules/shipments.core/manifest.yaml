manifest_schema: uok.module.v1
name: shipments.core
kind: business_module
version: APP_VERSION
description: "Tenant-scoped operational Shipment headers and document requirements over governed Party, Location, Route, and Compliance references."
maturity: runtime_proven
installable: true
uninstallable: true
updatable: true
maintainable: true
required: false
lifecycle:
  - available
  - installed
  - disabled
  - upgraded
  - uninstalled
commands:
  - AddShipmentDocumentRequirement
  - CreateShipment
  - RemoveShipmentDocumentRequirement
  - SetShipmentDocumentRequirementStatus
  - UpdateShipment
  - UpdateShipmentDocumentRequirement
  - TransitionShipmentStatus
events:
  - ShipmentDocumentRequirementAdded
  - ShipmentDocumentRequirementRemoved
  - ShipmentDocumentRequirementStatusChanged
  - ShipmentDocumentRequirementUpdated
  - ShipmentCreated
  - ShipmentUpdated
  - ShipmentStatusTransitioned
dependencies:
  - compliance.core
  - contacts.core
  - locations.core
  - routes.core
backend_path: modules/shipments.core/backend
web_path: modules/shipments.core/web
web_entry: modules/shipments.core/web/src/moduleSurface.tsx
web_section: shipments
migrations_path: modules/shipments.core/migrations
tests_path: modules/shipments.core/tests
api_prefixes:
  - /api/shipments
api_router: uok_shipments_core.public_api:api_router
command_handlers: uok_shipments_core.public_api:command_handlers
command_permissions: uok_shipments_core.public_api:command_permissions
role_grants: uok_shipments_core.public_api:role_grants
model_exports: uok_shipments_core._internal.persistence.models:owned_models
candidate_verifier_script: modules/shipments.core/verify/UokCandidateShipmentSupport.ps1
candidate_verifier_function: Invoke-UokShipmentSupportCandidateScenario
permissions:
  - shipments.read
  - shipments.manage
owned_tables:
  - Shipment
  - ShipmentDocumentRequirement
  - ShipmentDocumentRequirementHistory
  - ShipmentStatusHistory
  - CommandLog:shipments.core
  - EventRecord:Shipment
  - EventRecord:ShipmentDocumentRequirement
extension_points:
  - api_router
  - command_handlers
  - command_permissions
  - role_grants
  - model_exports
  - web_surface
  - candidate_verifier
data_retention_policy: "Terminal and active Shipment headers, current document requirements, stable owner IDs, append-only status and requirement history, and command/event evidence are retained. Module uninstall disables access while preserving tenant-owned records for authorized recovery."
